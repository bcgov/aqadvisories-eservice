name: Merge

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - '.github/**'
      - '.github/graphics/**'
      - '!.github/workflows/**'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (image tag) to deploy; required for manual runs
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    name: Initialize
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ inputs.pr || steps.pr.outputs.pr }}
    runs-on: ubuntu-24.04
    steps:
      # Get PR number for squash merges to master; manual runs supply it as an input
      - id: pr
        if: ${{ !inputs.pr }}
        uses: bcgov/action-get-pr@28b0adf8e4d40720d41f9c87356ce24b0a4bd6af # v0.3.1

      # The PR number is the image tag; without it TEST/PROD would deploy IMAGE_TAG=""
      - name: Require a PR number
        env:
          PR: ${{ inputs.pr || steps.pr.outputs.pr }}
        run: |
          if [ -z "${PR}" ]; then
            echo "ERROR: no PR found for ${GITHUB_SHA}. Merge changes through a PR, or run this workflow manually with the PR number to deploy."
            exit 1
          fi
          echo "Deploying images from PR ${PR}"
  deploy-test:
    name: TEST Deploys (${{ needs.init.outputs.pr }})
    needs: [init]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      db_admin_password: ${{ secrets.db_admin_password }}
      db_password: ${{ secrets.db_password }}
      gcnotify_account_key: ${{ secrets.gcnotify_account_key }}
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
    with:
      environment: test
      target: test
      tag: ${{ needs.init.outputs.pr }}

  tests:
    name: Tests
    needs: [deploy-test]
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: test

  deploy-prod:
    name: PROD Deploys (${{ needs.init.outputs.pr }})
    needs: [tests, init]
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      db_admin_password: ${{ secrets.db_admin_password }}
      db_password: ${{ secrets.db_password }}
      gcnotify_account_key: ${{ secrets.gcnotify_account_key }}
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
    with:
      environment: prod
      target: prod
      tag: ${{ needs.init.outputs.pr }}

  # Vanity TLS on the PROD frontend Service.
  # No-ops cleanly if vars.ROUTE_HOST is unset. Sibling of promote/monitor-prod
  # so an expired or invalid cert fails Merge after containers have already rolled.
  route-tls:
    name: Route TLS (PROD)
    needs: [deploy-prod]
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: bcgov/actions-openshift/route-tls@9d7230d1b1533eb02e98b9bd23fe89825d5c8b41 # untagged commit
        if: ${{ vars.ROUTE_HOST != '' }}
        with:
          hostname: ${{ vars.ROUTE_HOST }}
          target_service: ${{ github.event.repository.name }}-prod-frontend
          tls_certificate: ${{ secrets.TLS_CERTIFICATE }}
          tls_private_key: ${{ secrets.TLS_PRIVATE_KEY }}
          tls_ca_certificate: ${{ secrets.TLS_CA_CERTIFICATE }}
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}

  # Sync Sysdig email alerts for PROD. No-ops cleanly if SYSDIG_API_TOKEN is
  # unset or monitoring/alerts/ is empty — adoption is gradual. Alert
  # templates live in monitoring/alerts/ in this repo; add or remove files
  # there to customize the alert set.
  monitor-prod:
    name: Sysdig Monitor (PROD)
    needs: [deploy-prod]
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # monitoring/alerts/*.json depend on __APP__ template substitution — don't
      # downgrade this pin to a version without it.
      - uses: bcgov/actions/sysdig-monitor@6763b12e9c5e7548fe0e63a63e16fe01f0f33b91 # v0.7.0
        with:
          sysdig_api_token: ${{ secrets.SYSDIG_API_TOKEN }}
          oc_namespace: ${{ secrets.oc_namespace }}
          app: ${{ github.event.repository.name }}

  promote:
    name: Promote Images
    needs: [deploy-prod, init]
    runs-on: ubuntu-slim
    permissions:
      packages: write
    strategy:
      matrix:
        package: [backend, frontend]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.init.outputs.pr }}
          tags: prod
