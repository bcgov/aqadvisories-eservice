name: Scheduled

on:
  schedule: [cron: "0 11 * * 6"] # 3 AM PST = 12 PM UDT, Saturdays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  stale-branches:
    name: Close Stale PRs
    # issues: write is needed for the stale label and comments, which use the issues API
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # PRs only: issues (epics, features, bugs) are never marked stale or closed
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-label: stale
          stale-pr-message: >
            This PR has been marked stale due to no activity for 14 days.
            It will be closed in 7 days if no action is taken.
            Push a commit, comment or request review to reset the timer.
          close-pr-message: >
            This PR was closed after 21 days without activity.
            If you still need it, please reopen it.
          remove-stale-when-updated: true
          operations-per-run: 100
          debug-only: false

  ageOutPRs:
    name: PR Deployment Purge
    env:
      # https://tecadmin.net/getting-yesterdays-date-in-bash/
      CUTOFF: "1 week ago"
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Clean up PR Deployments
        uses: bcgov/action-oc-runner@111868d1fc50db0a40417ba321d865ef5c931bbd # v1.7.0
        with:
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_token: ${{ secrets.oc_token }}
          oc_server: ${{ vars.oc_server }}
          commands: |
            # Catch errors, unset variables, and pipe failures (e.g. grep || true )
            set -euo pipefail

            # Echos
            echo "Delete stale PR deployments"
            echo "Cutoff: ${{ env.CUTOFF }}"

            # Before date
            BEFORE=$(date +%s -d "${{ env.CUTOFF }}")
            REPO="${{ github.event.repository.name }}"

            # Get deployments matching the repo-PR naming pattern, with their app label.
            # Each PR has several deployments (backend, backend-cron, frontend) sharing
            # one app label, so the label is read here and each one is deleted only once.
            DEPLOYS=$(oc get deploy --no-headers -o custom-columns=:metadata.name,:metadata.creationTimestamp,:metadata.labels.app 2>/dev/null | grep -E "^${REPO}-[0-9]+-" || :)

            # If deployments, then iterate
            DELETED=" "
            FAILED=""
            if [ -n "${DEPLOYS}" ]; then
              while read -r name created label; do
                # Already removed along with another deployment of the same PR
                if [[ "${DELETED}" == *" ${label} "* ]]; then
                  continue
                fi

                # Convert creation timestamp to epoch
                UPDATED=$(date -d "${created}" +%s 2>/dev/null || :)

                # Compare to cutoff and delete as necessary
                if [[ -n "${UPDATED}" ]] && [[ ${UPDATED} -lt ${BEFORE} ]]; then
                  if [ -n "${label}" ] && [ "${label}" != "<none>" ]; then
                    echo -e "\nOlder than cutoff: ${name} (app=${label})"
                    oc delete all,secret,pvc,cm,networkpolicy,poddisruptionbudget -l "app=${label}" --ignore-not-found
                    DELETED="${DELETED}${label} "
                  else
                    echo -e "\nERROR: No app label found on deployment ${name}"
                    FAILED="${FAILED} ${name}"
                  fi
                else
                  echo -e "\nNewer than cutoff: ${name}"
                  echo "No need to delete"
                fi
              done <<< "${DEPLOYS}"
            else
              echo "No PR deployments found for ${{ github.event.repository.name }}"
            fi

            # Fail after processing every deployment, so one bad one doesn't block the rest
            if [ -n "${FAILED}" ]; then
              echo -e "\nDeployments without an app label, not deleted:${FAILED}"
              exit 1
            fi

  # ZAP, then the load tests one at a time, so TEST only carries one of them at once
  zap:
    name: ZAP Scans
    permissions:
      issues: write
    runs-on: ubuntu-24.04
    # the full scan's own default limit is 6 hours
    timeout-minutes: 60
    steps:
      - name: ZAP Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          allow_issue_writing: true
          issue_title: "ZAP Security Report"
          token: ${{ secrets.GITHUB_TOKEN }}
          target: https://${{ github.event.repository.name }}-test.apps.silver.devops.gov.bc.ca

  load-tests:
    name: Load
    # run even if ZAP failed or found issues
    needs: [zap]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    # each test runs for 5 minutes
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        name: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
      - uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1.4.0
        env:
          # backend is reached through the frontend (see common/tests/load/backend-test.js)
          BACKEND_URL: https://${{ github.event.repository.name }}-test.apps.silver.devops.gov.bc.ca
          FRONTEND_URL: https://${{ github.event.repository.name }}-test.apps.silver.devops.gov.bc.ca
        with:
          path: ./common/tests/load/${{ matrix.name }}-test.js
          flags: --vus 100 --duration 300s
