name: Cert Keeper

# Keeps the PROD vanity host's SSL/TLS certificate valid (bcgov/actions-openshift#158).
# Does nothing unless the repository variable ROUTE_HOST is set.

on:
  schedule:
    # Daily Let's Encrypt expiry check (runs only when vars.ROUTE_HOST is set).
    - cron: "29 14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Get a new certificate even if the current one is not due
        type: boolean
        default: false

concurrency:
  group: cert-keeper
  cancel-in-progress: false

permissions: {}

jobs:
  cert-keeper:
    name: Cert Keeper (${{ vars.ROUTE_HOST }})
    if: vars.ROUTE_HOST != ''
    environment: prod
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Keep the certificate valid
        uses: bcgov/actions-openshift/cert-keeper@47805d2fc4e919382757c1fbeb68d39313abe64f # v0.11.0
        with:
          hostname: ${{ vars.ROUTE_HOST }}
          route_name: ${{ github.event.repository.name }}-vanity-url
          target_service: ${{ github.event.repository.name }}-prod-frontend
          force: ${{ inputs.force }}
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}

      - name: Notify CODEOWNERS
        if: failure()
        uses: bcgov/actions/workflow-notifier@acc058abf85bb183dad21b839a92a40a4ff47af3 # v0.14.0
        with:
          title: "Cert Keeper failed"
          notify_author: "false"
          notify_codeowners: "always"
