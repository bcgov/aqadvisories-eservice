apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    value: quickstart-openshift
  - name: MONGO_DATABASE
    description: MongoDB database name
    value: app
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: DB_USER
    description: >-
      MongoDB user the backend connects as. On a new (empty) volume it is created in
      MONGO_DATABASE; with an existing volume it must be a user that already exists in that data.
    required: true
  - name: DB_PASSWORD
    description: >-
      Password for DB_USER. It is embedded in database-uri, so use
      URL-safe characters only (letters, digits, - . _ ~).
    required: true
  - name: DB_ADMIN_PASSWORD
    description: Password for the MongoDB "admin" user (MONGODB_ADMIN_PASSWORD). Not used by the backend.
    required: true
  - name: DB_AUTH_SOURCE
    description: >-
      Database that DB_USER is defined in. The Red Hat image creates it in MONGO_DATABASE,
      so keep the two equal unless an existing volume defines the user elsewhere.
    value: app
objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-${ZONE}-database
      labels:
        app: ${NAME}-${ZONE}
    # Read by common/openshift.database.yml (MONGODB_*) and the backend.
    stringData:
      database-admin-password: ${DB_ADMIN_PASSWORD}
      database-name: ${MONGO_DATABASE}
      database-password: ${DB_PASSWORD}
      database-user: ${DB_USER}
      database-uri: mongodb://${DB_USER}:${DB_PASSWORD}@${NAME}-${ZONE}-database:27017/${MONGO_DATABASE}?authSource=${DB_AUTH_SOURCE}
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-frontend-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-frontend
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
      policyTypes:
        - Ingress
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-backend-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-backend
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: ${NAME}-${ZONE}
                  deployment: ${NAME}-${ZONE}-frontend
            # NotifyBC calls its own API through the backend Service to send large
            # broadcasts in chunks (more than broadcastSubscriberChunkSize subscribers)
            - podSelector:
                matchLabels:
                  app: ${NAME}-${ZONE}
                  deployment: ${NAME}-${ZONE}-backend
        # Inbound SMTP from the router (passthrough SMTP Route); the API on 3000 stays
        # reachable only through the frontend
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
          ports:
            - protocol: TCP
              port: 2525
      policyTypes:
        - Ingress
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-${ZONE}-database-ingress
      labels:
        app: ${NAME}-${ZONE}
    spec:
      podSelector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-database
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: ${NAME}-${ZONE}
                  deployment: ${NAME}-${ZONE}-backend
            - podSelector:
                matchLabels:
                  app: ${NAME}-${ZONE}
                  deployment: ${NAME}-${ZONE}-backend-cron
          ports:
            - protocol: TCP
              port: 27017
      policyTypes:
        - Ingress
