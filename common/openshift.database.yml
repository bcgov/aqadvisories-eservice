apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Product name
    required: true
  - name: COMPONENT
    description: Component name
    value: database
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: MONGO_IMAGE
    description: >-
      Red Hat MongoDB image (registry.redhat.io/rhscl/mongodb-36-rhel7:1), pulled from the
      cluster's shared "openshift" namespace and pinned to the digest the existing mongodb2
      DeploymentConfig runs. The backend uses loopback-connector-mongodb 5 (mongodb driver 3.6).
    value: image-registry.openshift-image-registry.svc:5000/openshift/mongodb@sha256:8dc9932eabd30f2ee4d0b882500c65b48f3c2fbbd85bfd51d0d18410af404a39
  - name: DB_PVC_NAME
    description: >-
      Existing PersistentVolumeClaim holding the MongoDB data. Not created by this
      template: the deploy workflow creates <NAME>-<ZONE>-database when it is missing,
      or uses an existing claim named by the DB_PVC_NAME GitHub variable.
    required: true
  - name: MEMORY_LIMIT
    description: Memory limit for the database container (bounds the pod's working set).
    value: 1Gi

objects:
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      # Governing Service required by the StatefulSet. With a single replica the
      # ClusterIP Service below doubles as both the governing service and the
      # connection endpoint; no separate headless Service is needed.
      serviceName: ${NAME}-${ZONE}-${COMPONENT}
      replicas: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          # Give mongod time to flush and shut down cleanly on SIGTERM during a node drain.
          terminationGracePeriodSeconds: 60
          containers:
            - name: ${NAME}-${ZONE}
              image: ${MONGO_IMAGE}
              imagePullPolicy: IfNotPresent
              # No command override: the image's run-mongod creates the admin user and
              # MONGODB_USER (in MONGODB_DATABASE) on an empty volume, then runs mongod --auth.
              # mongodb2 runs "mongod --auth" directly, which only works on a volume whose
              # users already exist.
              ports:
                - name: mongodb
                  containerPort: 27017
              # Reuses the Secret from common/openshift.init.yml. MONGODB_USER lives in
              # MONGODB_DATABASE, so the backend connects with ?authSource=<database-name>.
              env:
                - name: MONGODB_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-user
                - name: MONGODB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-password
                - name: MONGODB_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-admin-password
                - name: MONGODB_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-database
                      key: database-name
              volumeMounts:
                - name: data
                  mountPath: /var/lib/mongodb/data
              resources:
                requests:
                  cpu: 50m
                  memory: ${MEMORY_LIMIT}
                limits:
                  memory: ${MEMORY_LIMIT}
              # restricted-v2 SCC hardening. The image supports OpenShift's random UID;
              # fsGroup makes the volume writable. Do not hard-code the UID/GID.
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              readinessProbe:
                exec:
                  command:
                    - /bin/sh
                    - -i
                    - -c
                    - mongo 127.0.0.1:27017/$MONGODB_DATABASE -u $MONGODB_USER -p $MONGODB_PASSWORD --eval="quit()"
                successThreshold: 1
                failureThreshold: 3
                initialDelaySeconds: 3
                periodSeconds: 10
                timeoutSeconds: 1
              livenessProbe:
                tcpSocket:
                  port: 27017
                successThreshold: 1
                failureThreshold: 3
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 1
          volumes:
            # A standalone claim (not a volumeClaimTemplate), so an environment can reuse
            # an existing volume and its data. The claim is never created, resized or
            # deleted here. A major MongoDB upgrade is a deliberate migration (one major
            # version at a time, setting featureCompatibilityVersion), never a volume swap.
            - name: data
              persistentVolumeClaim:
                claimName: ${DB_PVC_NAME}
  # ClusterIP Service: the backend connects here via ${NAME}-${ZONE}-${COMPONENT}:27017, e.g.
  # mongodb://<database-user>:<database-password>@${NAME}-${ZONE}-${COMPONENT}:27017/<database-name>?authSource=<database-name>
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: mongodb
          port: 27017
          targetPort: 27017
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
