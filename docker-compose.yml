services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend
    environment:
      NODE_ENV: development
      # one process: with the memory connector each worker process would have its own data
      NOTIFYBC_WORKER_PROCESS_COUNT: "1"
    ports: ["${BACKEND_PORT:-3000}:3000"]
    volumes:
      # memory connector persists to server/database/data.json
      - backend-data:/usr/src/app/server/database
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/api/configurations"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped

  frontend:
    container_name: frontend
    build: ./frontend
    image: frontend
    # values come from the shell or a .env file next to this compose file
    environment:
      port: 3001
      notify_bc_root_url: ${NOTIFY_BC_ROOT_URL:-http://backend:3000}
      notification_sender_role: ${NOTIFICATION_SENDER_ROLE:-realm:notificaton-sender}
      recaptcha_secret: ${RECAPTCHA_SECRET:-}
      swift_unsubscription_keyword: ${SWIFT_UNSUBSCRIPTION_KEYWORD:-STOP}
      trust_proxy: ${TRUST_PROXY:-}
      # optional SSO overrides; when empty, keycloak.json's values are used
      keycloak_auth_server_url: ${KEYCLOAK_AUTH_SERVER_URL:-}
      keycloak_realm: ${KEYCLOAK_REALM:-}
      keycloak_client_id: ${KEYCLOAK_CLIENT_ID:-}
    ports: ["${FRONTEND_PORT:-3001}:3001"]
    volumes:
      - frontend-sessions:/mnt/sessions
      # keycloak.json is built into the image; this mount picks up local edits
      # to it without rebuilding
      - ./frontend/keycloak.json:/app/keycloak.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/ping"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

