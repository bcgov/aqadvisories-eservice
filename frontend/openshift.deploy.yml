apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAME
    description: Module name
    required: true
  - name: COMPONENT
    description: Component name
    value: frontend
  - name: ZONE
    description: Deployment zone, e.g. pr-### or prod
    required: true
  - name: IMAGE_TAG
    description: Image tag to use
    required: true
  - name: REGISTRY
    description: Container registry to import from
    value: ghcr.io
  - name: ORG_NAME
    description: Organization name
    value: bcgov
  - name: DOMAIN
    value: apps.silver.devops.gov.bc.ca
  - name: MIN_REPLICAS
    description: The minimum amount of replicas for the horizontal pod autoscaler.
    value: '2'
  - name: MAX_REPLICAS
    description: The maximum amount of replicas for the horizontal pod autoscaler.
    value: '5'
  - name: CPU_REQUEST
    value: '50m'
  - name: MEMORY_REQUEST
    value: '64Mi'
  - name: MEMORY_LIMIT
    description: Memory limit for the container (bounds the pod's working set).
    value: '1Gi'
  - name: NOTIFICATION_SENDER_ROLE
    description: Keycloak role allowed to send advisories (the app's default spelling is kept).
    value: 'realm:notificaton-sender'
objects:
  # Optional per-environment secrets, read with optional: true so the app still starts
  # without them (subscriptions then fail reCAPTCHA verification; SSO falls back to the
  # image's keycloak.json). Create or update with:
  #   oc create secret generic <NAME>-<ZONE>-frontend \
  #     --from-literal=recaptcha-secret=... --from-literal=swift-unsubscription-keyword=STOP \
  #     --from-literal=keycloak-auth-server-url=https://.../auth \
  #     --from-literal=keycloak-realm=... --from-literal=keycloak-client-id=...
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1
      template:
        metadata:
          labels:
            app: ${NAME}-${ZONE}
            deployment: ${NAME}-${ZONE}-${COMPONENT}
        spec:
          terminationGracePeriodSeconds: 30
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        deployment: ${NAME}-${ZONE}-${COMPONENT}
                    topologyKey: kubernetes.io/hostname
          containers:
            - name: ${NAME}
              image: ${REGISTRY}/${ORG_NAME}/${NAME}/${COMPONENT}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - name: http
                  containerPort: 3001
              env:
                - name: port
                  value: '3001'
                # backend Service listens on 80 (-> NotifyBC 3000)
                - name: notify_bc_root_url
                  value: http://${NAME}-${ZONE}-backend
                - name: notification_sender_role
                  value: ${NOTIFICATION_SENDER_ROLE}
                # behind the OpenShift router: use X-Forwarded-* for the client IP and
                # https scheme (Keycloak builds its redirect URI from it). Env values are
                # strings, which express parses as IPs/CIDRs or names ("true" would crash);
                # "uniquelocal" trusts the private ranges the router connects from.
                - name: trust_proxy
                  value: uniquelocal
                - name: recaptcha_secret
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-frontend
                      key: recaptcha-secret
                      optional: true
                - name: swift_unsubscription_keyword
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-frontend
                      key: swift-unsubscription-keyword
                      optional: true
                # SSO overrides; when unset, the image's keycloak.json values are used
                - name: keycloak_auth_server_url
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-frontend
                      key: keycloak-auth-server-url
                      optional: true
                - name: keycloak_realm
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-frontend
                      key: keycloak-realm
                      optional: true
                - name: keycloak_client_id
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-${ZONE}-frontend
                      key: keycloak-client-id
                      optional: true
              resources:
                requests:
                  cpu: ${CPU_REQUEST}
                  memory: ${MEMORY_REQUEST}
                limits:
                  memory: ${MEMORY_LIMIT}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ['ALL']
                seccompProfile:
                  type: RuntimeDefault
              # session-file-store writes here (file_store_path in the image). Sessions are
              # per pod; the Route's sticky-session cookie keeps a browser on one pod.
              volumeMounts:
                - name: sessions
                  mountPath: /mnt/sessions
              startupProbe:
                httpGet:
                  path: /ping
                  port: http
                periodSeconds: 5
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /ping
                  port: http
                periodSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /ping
                  port: http
                periodSeconds: 10
                failureThreshold: 3
              lifecycle:
                preStop:
                  exec:
                    command: ['sleep', '10']
          volumes:
            - name: sessions
              emptyDir:
                sizeLimit: 256Mi
  - apiVersion: v1
    kind: Service
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      ports:
        - name: http
          port: 80
          targetPort: 3001
      selector:
        deployment: ${NAME}-${ZONE}-${COMPONENT}
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      host: ${NAME}-${ZONE}.${DOMAIN}
      to:
        kind: Service
        name: ${NAME}-${ZONE}-${COMPONENT}
        weight: 100
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}-${ZONE}-${COMPONENT}
      minReplicas: ${{MIN_REPLICAS}}
      maxReplicas: ${{MAX_REPLICAS}}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
          selectPolicy: Max
  - apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      labels:
        app: ${NAME}-${ZONE}
      name: ${NAME}-${ZONE}-${COMPONENT}
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          deployment: ${NAME}-${ZONE}-${COMPONENT}
